<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 54 · Spiral Matrix — Code Trace</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#171c24;--muted:#697386;--panel:#f8fafc;--border:#dfe3ea;--visited:#dcf2e6;--vfg:#17553d;--current:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#17191d;--fg:#f2f4f7;--muted:#a5aebd;--panel:#242831;--border:#424853;--visited:#164d3b;--vfg:#d8f8e7;--current:#2350ba}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
main{max-width:1100px;margin:22px auto;padding:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title{font-size:21px;font-weight:750}.muted{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:18px}.label{font-weight:700;margin:0 0 10px}.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cell{aspect-ratio:1;background:var(--panel);border:1px solid var(--border);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;font-weight:700;transition:background .12s}.cell small{font-size:11px;color:var(--muted);font-weight:400}.cell.visited{background:var(--visited);color:var(--vfg)}.cell.active{background:var(--current);color:white;border:3px solid #eab93d}.cell.active small{color:#e3ebff}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}.stat{border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:20px}.result{margin-top:16px}.values{font:15px/1.7 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}.code{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto;padding:10px 0}.line{display:flex;min-width:max-content;line-height:25px;white-space:pre;font:13px/25px ui-monospace,SFMono-Regular,Menlo,monospace;border-left:5px solid transparent;padding-right:18px}.line .ln{color:var(--muted);display:inline-block;width:34px;flex-shrink:0;text-align:right;margin-right:12px;font-size:11px}.line.comment:not(.on){color:#668b75}.line.on{background:#2563eb;color:#fff;border-left-color:#fbbf24;font-weight:750}.line.on .ln{color:#fff}.explain{margin-top:18px;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:14px;min-height:76px}.controls{margin-top:14px;display:flex;justify-content:space-between;gap:8px}button{cursor:pointer;background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:10px 15px;border-radius:8px;font-weight:650}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.35;cursor:default}input[type=range]{margin-top:15px;width:100%;accent-color:#2563eb}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--visited);border:1px solid var(--border)}.legend span:first-child:before{background:#2563eb}.back{color:var(--muted);text-decoration:none;font-size:12px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.cell{max-height:125px}.line{font-size:12px}}
</style></head><body><main>
<header class="head"><div><div class="title">LC 54 · Spiral Matrix</div><div class="muted">3×3 Matrix · Python execution tracing</div></div><div class="muted" id="progress"></div></header>
<div class="layout"><section><div class="label">Matrix</div><div class="matrix" id="matrix"></div><div class="stats" id="stats"></div><div class="result"><div class="label">Result Array</div><div class="values" id="result">[]</div></div><div class="legend"><span>当前执行</span><span>绿色：已访问</span></div></section>
<section><div class="head" style="margin-bottom:8px"><div class="label" style="margin:0">Python Code</div><div class="muted" id="lineLabel"></div></div><div class="code" id="code"></div></section></div>
<div class="explain"><strong id="stepTitle"></strong><div id="description" style="margin-top:4px"></div></div>
<input type="range" id="slider" min="0" value="0" step="1" aria-label="执行步骤">
<div class="controls"><button id="prev">← 上一步</button><button id="reset">重置</button><button class="primary" id="next">下一步 →</button></div>
<p class="muted" style="margin-top:18px">每个 Step 对应原始 Python 代码的当前执行行。← / → 也可切换步骤。<a class="back" href="./index.html">返回演示列表</a></p></main>
<script src="./54.js" defer></script></body></html>
