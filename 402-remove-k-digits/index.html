<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 402 · Interactive Dry Run</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#18212e;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:930px;margin:35px auto;padding:0 20px}h1{font-size:30px;margin:0 0 7px}.muted{color:#64748b}.card{border:1px solid #e2e8f0;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 4px 16px #1e293b08}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.chip{padding:7px 12px;border:1px solid #dbe3ee;border-radius:8px;background:#f8fafc;cursor:pointer}.chip.active{background:#e0f2fe;border-color:#0284c7}button{border:1px solid #cbd5e1;background:white;padding:10px 15px;border-radius:9px;cursor:pointer;font-weight:600}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#2563eb;color:white;border-color:#2563eb}.digit{width:48px;height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:9px;border:1px solid #e2e8f0;background:#f8fafc;font-size:22px;font-weight:700}.digit small{font-size:10px;color:#64748b}.digit.now{background:#dbeafe;border-color:#3b82f6}.digit.done{background:#dcfce7;border-color:#86efac}.digit.popped{background:#fee2e2;border-color:#fca5a5;text-decoration:line-through}.pill{background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:12px 16px;font-weight:700;font-size:21px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f8fafc;padding:12px;border-radius:10px}.metric b{display:block;font-size:20px;margin-top:5px}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:18px;border-radius:12px;font-size:13px;line-height:1.8}pre .focus{background:#334155;color:#86efac;display:block;margin:0 -7px;padding:0 7px;border-radius:4px}.explain{background:#eff6ff;border-radius:10px;padding:14px;line-height:1.7;min-height:70px}input{padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}label{font-size:13px;color:#64748b}#stack{min-height:55px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.sub{font-size:13px;color:#64748b}a{color:#2563eb}@media(max-width:620px){.metrics{grid-template-columns:repeat(2,1fr)}.digit{width:39px;height:49px;font-size:18px}h1{font-size:25px}.card{padding:14px}}@media(prefers-color-scheme:dark){:root{color:#e2e8f0;background:#0b1220}.card{border-color:#334155}.muted,.sub,label{color:#94a3b8}.chip,.metric,.digit{background:#1e293b;color:#e2e8f0;border-color:#475569}.chip.active{background:#164e63}.digit.now{background:#1e3a8a}.digit.done,.pill{background:#14532d;color:#dcfce7}.digit.popped{background:#7f1d1d}.explain{background:#172554}button{background:#1e293b;color:#e2e8f0}button.primary{background:#2563eb}input{background:#1e293b;color:#fff;border-color:#475569}}</style>
<main><div class="muted">LEETCODE 402 · GREEDY + MONOTONIC STACK</div><h1>Remove K Digits — Interactive Dry Run</h1><p class="muted">按 Next 逐行观察 Stack、k、remain 与 Leading Zeros；可切换案例或输入自定义数据。</p>
<div class="card"><div class="top"><strong>测试案例</strong><span id="stepNo" class="muted"></span></div><div class="row" id="presets" style="margin:14px 0"></div><div class="row"><label>num <input id="num" value="1432219" inputmode="numeric" size="14"></label><label>k <input id="k" type="number" min="0" value="3" style="width:70px"></label><button id="apply">Apply</button></div></div>
<div class="card"><strong>Input Array</strong><div id="digits" class="row" style="margin-top:12px"></div><div class="metrics" style="margin-top:16px"><div class="metric"><span class="muted">Original k</span><b id="initialK"></b></div><div class="metric"><span class="muted">k remaining</span><b id="remainingK"></b></div><div class="metric"><span class="muted">remain = len(num) − k</span><b id="remain"></b></div><div class="metric"><span class="muted">Current index</span><b id="index"></b></div></div><h3>Monotonic Stack</h3><div id="stack" class="row"></div><h3>当前操作</h3><div id="explain" class="explain"></div><h3>Python Code（当前行高亮）</h3><pre id="code"></pre><div class="footer"><button id="prev">← Previous</button><button id="reset">Reset</button><button class="primary" id="next">Next →</button></div><p class="sub">结果：<strong id="result">—</strong></p></div></main>
<script>
const presets=[["1432219",3,"连续 Pop"],["10200",1,"Leading Zeros"],["12345",2,"剩余 k"],["10",2,"全部删除"],["112",1,"相等不 Pop"],["7650281",3,"多次 Pop"]];
const lines=["remain = len(num) - k","stack = []","","for digit in num:","    while k > 0 and stack and stack[-1] > digit:","        stack.pop()","        k -= 1","    stack.append(digit)","","res = \"\".join(stack[:remain]).lstrip(\"0\")","return res or \"0\""];
let steps=[],cursor=0,num="",k0=0;
const $=id=>document.getElementById(id);
function make(n,k){num=n;k0=k;const s=[];let stack=[],left=k;const snap=(line,index,msg,removed=-1,result=null)=>s.push({line,index,msg,stack:[...stack],left,removed,result});
snap(0,-1,"初始化：remain = len(num) - k = "+(n.length-k)+"；必须在 k 变化之前计算。");
snap(1,-1,"创建空 Stack，准备从左向右扫描。");
for(let i=0;i<n.length;i++){let d=n[i];snap(4,i,"检查当前 digit = "+d+"。若 k > 0 且 Stack Top > digit，则需要 Pop。");
while(left>0&&stack.length&&stack[stack.length-1]>d){let old=stack.pop();snap(5,i,"Pop "+old+"：因为 "+old+" > "+d+"，删除较大的高位数字，让 "+d+" 提前。",old);left--;snap(6,i,"删除次数 k 减 1，现在 k = "+left+"。");snap(4,i,"再次检查 while：可能需要连续 Pop。");}
stack.push(d);snap(7,i,"Push "+d+"；当前 Stack = ["+stack.join(", ")+"]。");}
let raw=stack.slice(0,n.length-k).join(""),stripped=raw.replace(/^0+/,""),result=stripped||"0";
snap(9,n.length,"扫描结束：Stack = "+stack.join("")+"；按 remain = "+(n.length-k)+" 截取前 "+(n.length-k)+" 位，得到 "+(raw||'空字符串')+"；lstrip('0') 去除 Leading Zeros → "+(stripped||'空字符串')+"。");
snap(10,n.length,"最终返回 "+result+"。", -1,result);
steps=s;cursor=0;render();}
function render(){let s=steps[cursor];$("stepNo").textContent="Step "+(cursor+1)+" / "+steps.length;$("initialK").textContent=k0;$("remainingK").textContent=s.left;$("remain").textContent=num.length-k0;$("index").textContent=s.index>=num.length?"Done":s.index<0?"—":s.index;
$("digits").innerHTML=[...num].map((d,i)=>'<div class="digit '+(i===s.index?'now':i<s.index?'done':'')+'">'+d+'<small>'+i+'</small></div>').join("");
$("stack").innerHTML=s.stack.map((d,i)=>'<div class="pill">'+d+'</div>').join("")||'<span class="muted">Empty</span>';$("explain").textContent=s.msg;$("code").innerHTML=lines.map((l,i)=>'<span '+(i===s.line?'class="focus"':'')+'>'+escapeHtml(l||" ")+'</span>').join("\n");$("result").textContent=s.result??"—";$("prev").disabled=cursor===0;$("next").disabled=cursor===steps.length-1;}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
$("presets").innerHTML=presets.map(([n,k,label],i)=>'<button class="chip" data-i="'+i+'">'+label+' · '+n+'</button>').join("");
$("presets").addEventListener("click",e=>{let b=e.target.closest("[data-i]");if(!b)return;let p=presets[+b.dataset.i];$("num").value=p[0];$("k").value=p[1];document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));make(p[0],p[1]);});
$("apply").onclick=()=>{let n=$("num").value.trim(),k=Number($("k").value);if(!/^\d+$/.test(n)||!Number.isInteger(k)||k<0||k>n.length){alert("请输入非空数字字符串，并确保 0 ≤ k ≤ num.length");return;}document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));make(n,k);};
$("prev").onclick=()=>{cursor=Math.max(0,cursor-1);render();};$("next").onclick=()=>{cursor=Math.min(steps.length-1,cursor+1);render();};$("reset").onclick=()=>{cursor=0;render();};document.querySelector(".chip").classList.add("active");make("1432219",3);
</script></html>
